{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} Subscription | NexusRecurring{% endblock %}
{% block page_title %}{% if editing %}Edit Subscription{% else %}New Subscription{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" name="customer_name" value="{{ record.customer_name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Customer Email</label>
        <input type="email" name="customer_email" value="{{ record.customer_email|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Plan Name</label>
        <input type="text" name="plan_name" value="{{ record.plan_name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="active" {% if record.status == 'active' %}selected{% endif %}>Active</option>
          <option value="past_due" {% if record.status == 'past_due' %}selected{% endif %}>Past Due</option>
          <option value="cancelled" {% if record.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
          <option value="trialing" {% if record.status == 'trialing' %}selected{% endif %}>Trialing</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        <input type="date" name="start_date" value="{{ record.start_date|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="form-group">
        <label>Next Billing</label>
        <input type="date" name="next_billing" value="{{ record.next_billing|date:'Y-m-d'|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mrr</label>
        <input type="number" step="0.01" name="mrr" value="{{ record.mrr|default:'0' }}">
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} Subscription</button>
      <a href="/subscriptions/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
